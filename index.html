<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="基于 FastAPI 官方中文文档知识库的检索增强问答助手：回答问题并附引用来源，可溯源、不编造。">
<title>FastAPI 文档助手 · 知识库智能问答</title>
<!-- 内联 SVG 图标：免得浏览器去要 /favicon.ico 拿一个 404 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23009e8a' stroke-width='2.1' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 5.5A2.5 2.5 0 016.5 3H19v15H6.5A2.5 2.5 0 004 20.5z'/%3E%3Cpath d='M8 8h7M8 11.5h5'/%3E%3C/svg%3E">
<style>
  /* ==========================================================
     设计变量
     配色取自 FastAPI 文档站的青绿主色，做成「文档工作台」观感，
     与电商客服项目的手机聊天窗完全不同。
     ========================================================== */
  :root {
    color-scheme: light;

    --bg: #F4F7F8;
    --panel: #FFFFFF;
    --panel-2: #FAFCFC;
    --line: #E3EAEC;
    --line-2: #D6E0E3;

    --ink: #16232A;
    --ink-2: #43575F;
    --muted: #7C9199;
    --faint: #A6B6BC;

    --accent: #0C8A7E;
    --accent-2: #0FA795;
    --accent-soft: #E6F5F2;
    --accent-ring: rgba(12, 138, 126, 0.16);

    --code-bg: #10303A;
    --code-ink: #D9F2EC;
    --code-inline-bg: #EDF4F5;
    --code-inline-ink: #0B6E64;

    --q-bar: #0FA795;
    --score-hi: #0FA795;
    --score-mid: #D8A03C;
    --score-lo: #C4796F;

    --warn-bg: #FCF7EA;
    --warn-line: #F1E6CD;
    --warn-ink: #8A7033;
    --err-bg: #FDF1EF;
    --err-line: #F5DAD5;
    --err-ink: #A2543F;

    --shadow-panel: 0 1px 2px rgba(16, 48, 58, 0.04), 0 12px 32px -20px rgba(16, 48, 58, 0.18);
    --shadow-pop: 0 18px 44px -22px rgba(16, 48, 58, 0.42);

    --radius: 14px;
    --radius-sm: 10px;
    --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;

      --bg: #0C1417;
      --panel: #121C20;
      --panel-2: #162126;
      --line: #1F2C31;
      --line-2: #2A3A40;

      --ink: #E6EFF1;
      --ink-2: #AFC1C6;
      --muted: #7E9299;
      --faint: #5C6E74;

      --accent: #2ED3BC;
      --accent-2: #45E0CA;
      --accent-soft: rgba(46, 211, 188, 0.12);
      --accent-ring: rgba(46, 211, 188, 0.22);

      --code-bg: #0A1A20;
      --code-ink: #CDEDE6;
      --code-inline-bg: #1B2A2F;
      --code-inline-ink: #58D8C4;

      --q-bar: #2ED3BC;
      --score-hi: #2ED3BC;
      --score-mid: #D8B055;
      --score-lo: #C4796F;

      --warn-bg: #1E1A12;
      --warn-line: #322C1C;
      --warn-ink: #D6B565;
      --err-bg: #221614;
      --err-line: #3A2320;
      --err-ink: #E0A08C;

      --shadow-panel: 0 1px 2px rgba(0, 0, 0, 0.4), 0 12px 32px -20px rgba(0, 0, 0, 0.7);
      --shadow-pop: 0 18px 44px -22px rgba(0, 0, 0, 0.8);
    }
  }

  /* ================= 基础 ================= */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  button { font-family: inherit; cursor: pointer; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ================= 应用外壳（三栏） ================= */
  .app {
    height: 100vh;
    height: 100dvh;
    display: grid;
    grid-template-columns: 248px minmax(0, 1fr) 340px;
    gap: 0;
  }

  /* ================= 左栏：导航 ================= */
  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 20px 16px;
    background: var(--panel);
    border-right: 1px solid var(--line);
    overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 4px 0; }
  .brand-mark {
    flex: 0 0 34px;
    width: 34px; height: 34px;
    border-radius: 10px;
    display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    color: #fff;
    box-shadow: 0 6px 14px -8px var(--accent);
  }
  .brand-text h1 { font-size: 14.5px; font-weight: 650; line-height: 1.35; letter-spacing: 0.01em; }
  .brand-text p { font-size: 11px; color: var(--muted); line-height: 1.4; }

  .btn-new {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--line-2);
    border-radius: var(--radius-sm);
    background: var(--panel-2);
    color: var(--ink);
    font-size: 13px;
    font-weight: 550;
    transition: border-color 0.18s ease, color 0.18s ease, background 0.18s ease, transform 0.18s ease;
  }
  .btn-new:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .btn-new:active { transform: translateY(1px); }

  .nav-title {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--faint);
    padding: 0 5px;
    margin-bottom: 8px;
  }

  .kb-card {
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    background: var(--panel-2);
    border: 1px solid var(--line);
  }
  .kb-card .kb-name {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 600; color: var(--ink);
  }
  .kb-card .kb-name svg { color: var(--accent); flex: 0 0 auto; }
  .kb-badge {
    margin-left: auto;
    font-size: 10px;
    font-weight: 600;
    padding: 1px 7px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    white-space: nowrap;
  }
  .kb-desc {
    margin-top: 6px;
    font-size: 11px;
    line-height: 1.5;
    color: var(--muted);
  }

  .examples { display: grid; gap: 6px; }
  .ex-item {
    text-align: left;
    padding: 9px 11px;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink-2);
    font-size: 12.5px;
    line-height: 1.5;
    transition: background 0.16s ease, color 0.16s ease, border-color 0.16s ease;
  }
  .ex-item:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-ring); }

  .sidebar-foot {
    margin-top: auto;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    display: grid;
    gap: 7px;
    font-size: 11px;
    color: var(--faint);
    line-height: 1.5;
  }
  .sidebar-foot a { font-size: 11.5px; font-weight: 550; }

  /* ================= 中栏：主区 ================= */
  .main {
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--bg);
  }

  .topbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 22px;
    background: rgba(255, 255, 255, 0.72);
    border-bottom: 1px solid var(--line);
    backdrop-filter: saturate(150%) blur(8px);
  }
  @media (prefers-color-scheme: dark) {
    .topbar { background: rgba(18, 28, 32, 0.72); }
  }
  .topbar h2 { font-size: 13.5px; font-weight: 600; letter-spacing: 0.01em; }

  .status-pill {
    margin-left: auto;
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 12px 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--line-2);
    background: var(--panel);
    font-size: 11.5px;
    font-weight: 500;
    color: var(--ink-2);
    white-space: nowrap;
  }
  .status-pill i {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--faint);
    flex: 0 0 auto;
  }
  body[data-mode="live"] .status-pill i { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
  body[data-mode="checking"] .status-pill i { background: var(--score-mid); animation: pulse 1.4s ease-in-out infinite; }
  body[data-mode="unavailable"] .status-pill i { background: var(--score-lo); }

  /* 窄屏（≤1180px）左栏整体隐藏后，顶栏这两个按钮补上它原有入口：「新对话」与「来源」。
     宽屏时左栏自带「开启新对话」，来源面板常驻，两个按钮都收起。 */
  .top-btn {
    display: none;
    align-items: center; gap: 6px;
    padding: 6px 11px;
    border-radius: 999px;
    border: 1px solid var(--line-2);
    background: var(--panel);
    color: var(--ink-2);
    font-size: 11.5px;
    font-weight: 500;
  }
  .top-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- 问答流 ---- */
  .stream {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 28px 22px 8px;
    scrollbar-width: thin;
    scrollbar-color: var(--line-2) transparent;
    overscroll-behavior: contain;
  }
  .stream::-webkit-scrollbar { width: 8px; }
  .stream::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 999px; }
  .stream-inner { width: min(760px, 100%); margin: 0 auto; }

  /* ---- 空状态 ---- */
  .hero { padding: 26px 0 30px; }
  .hero-mark {
    width: 46px; height: 46px;
    border-radius: 13px;
    display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    color: #fff;
    box-shadow: 0 14px 30px -16px var(--accent);
    margin-bottom: 18px;
  }
  .hero h1 { font-size: 24px; font-weight: 680; letter-spacing: -0.01em; line-height: 1.3; }
  .hero p.lead {
    margin-top: 8px;
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--ink-2);
    max-width: 540px;
  }
  .hero .cards {
    margin-top: 20px;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
  .card {
    text-align: left;
    padding: 13px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--panel);
    box-shadow: var(--shadow-panel);
    transition: border-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-pop); }
  .card .c-title {
    font-size: 12.5px; font-weight: 600; color: var(--ink);
    margin-bottom: 4px;
  }
  .card .c-sub { font-size: 11.5px; line-height: 1.55; color: var(--muted); }

  /* ---- 一轮问答 ---- */
  .turn { padding-bottom: 26px; margin-bottom: 26px; border-bottom: 1px solid var(--line); }
  .turn:last-child { border-bottom: none; }

  .q {
    position: relative;
    padding: 10px 14px 10px 15px;
    border-radius: var(--radius-sm);
    background: var(--panel);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-panel);
    overflow: hidden;
  }
  .q::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--q-bar);
  }
  .q .q-text { font-size: 14px; line-height: 1.6; font-weight: 500; word-break: break-word; }
  /* 查询改写：把「口语提问 → 术语检索式」这一步显式展示出来，一眼可见改写是否生效 */
  .q .q-rewrite {
    margin-top: 8px;
    padding: 6px 10px;
    border-left: 2px solid var(--accent);
    background: var(--accent-soft);
    border-radius: 0 8px 8px 0;
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--ink-2);
    word-break: break-word;
  }
  .q .q-rewrite b { color: var(--accent); font-weight: 600; }

  .a { margin-top: 14px; }
  .a-body { min-width: 0; }
  .a-meta {
    display: flex; align-items: center; gap: 9px;
    font-size: 11px; color: var(--faint);
    margin-bottom: 7px;
  }
  .a-meta:empty { display: none; }
  .a-meta .pill {
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 550;
  }
  .a-content { font-size: 14.5px; line-height: 1.78; color: var(--ink); word-break: break-word; }

  /* ---- 回答里的 Markdown 排版 ---- */
  .a-content > *:first-child { margin-top: 0; }
  .a-content p { margin: 0 0 11px; }
  .a-content h4 {
    font-size: 14px; font-weight: 650;
    margin: 17px 0 8px;
    padding-left: 10px;
    border-left: 3px solid var(--accent);
  }
  .a-content ul, .a-content ol { margin: 0 0 12px; padding-left: 22px; }
  .a-content li { margin-bottom: 5px; line-height: 1.75; }
  .a-content strong { font-weight: 650; color: var(--ink); }
  .a-content code {
    font-family: var(--mono);
    font-size: 12.5px;
    padding: 1.5px 5px;
    border-radius: 5px;
    background: var(--code-inline-bg);
    color: var(--code-inline-ink);
    word-break: break-word;
  }
  .a-content pre.code {
    margin: 0 0 13px;
    padding: 13px 15px;
    border-radius: var(--radius-sm);
    background: var(--code-bg);
    overflow-x: auto;
    scrollbar-width: thin;
  }
  .a-content pre.code code {
    display: block;
    padding: 0;
    background: none;
    color: var(--code-ink);
    font-size: 12.5px;
    line-height: 1.7;
    white-space: pre;
    word-break: normal;
  }

  /* ---- 提示 / 错误 / 加载 ---- */
  .notice {
    display: flex; align-items: flex-start; gap: 9px;
    margin: 0 0 16px;
    padding: 11px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--warn-line);
    background: var(--warn-bg);
    color: var(--warn-ink);
    font-size: 12.5px;
    line-height: 1.6;
  }
  .notice.err { border-color: var(--err-line); background: var(--err-bg); color: var(--err-ink); }
  .notice svg { flex: 0 0 auto; margin-top: 1px; }
  .notice a { color: inherit; text-decoration: underline; font-weight: 600; }

  .typing { display: inline-flex; align-items: center; gap: 5px; padding: 5px 0; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); opacity: 0.3;
    animation: blink 1.3s ease-in-out infinite both;
  }
  .typing span:nth-child(2) { animation-delay: 0.18s; }
  .typing span:nth-child(3) { animation-delay: 0.36s; }

  .a-content.streaming::after {
    content: "";
    display: inline-block;
    width: 7px; height: 15px;
    margin-left: 3px;
    vertical-align: -2px;
    border-radius: 2px;
    background: var(--accent);
    animation: caret 1s steps(1) infinite;
  }

  /* ---- 输入区 ---- */
  .composer {
    flex: 0 0 auto;
    padding: 12px 22px 16px;
    background: linear-gradient(to top, var(--bg) 62%, transparent);
  }
  .composer-inner { width: min(760px, 100%); margin: 0 auto; }
  .input-shell {
    display: flex; align-items: flex-end; gap: 10px;
    padding: 9px 10px 9px 16px;
    border-radius: var(--radius);
    background: var(--panel);
    border: 1px solid var(--line-2);
    box-shadow: var(--shadow-panel);
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .input-shell:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
  .input-shell textarea {
    flex: 1; min-width: 0;
    border: none; outline: none; resize: none;
    background: transparent;
    font-family: inherit;
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--ink);
    max-height: 132px;
    padding: 5px 0;
  }
  .input-shell textarea::placeholder { color: var(--faint); }
  .send-btn {
    flex: 0 0 auto;
    width: 38px; height: 38px;
    display: grid; place-items: center;
    border: none;
    border-radius: 11px;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    color: #fff;
    transition: filter 0.16s ease, opacity 0.16s ease, transform 0.16s ease;
  }
  .send-btn:hover:not(:disabled) { filter: brightness(1.08); }
  .send-btn:active:not(:disabled) { transform: translateY(1px); }
  .send-btn:disabled { background: var(--line-2); color: var(--muted); opacity: 0.85; cursor: default; }
  .composer .hint {
    margin-top: 8px;
    text-align: center;
    font-size: 11px;
    color: var(--faint);
  }
  .composer .hint kbd {
    font-family: var(--mono);
    font-size: 10.5px;
    padding: 1px 5px;
    border-radius: 4px;
    background: var(--panel);
    border: 1px solid var(--line-2);
    color: var(--muted);
  }
  .input-shell textarea:disabled { cursor: not-allowed; }

  /* ================= 右栏：引用来源 ================= */
  .sources {
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--panel);
    border-left: 1px solid var(--line);
    overflow: hidden;
  }
  .sources-head {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 8px;
    padding: 15px 16px;
    border-bottom: 1px solid var(--line);
  }
  .sources-head h2 {
    font-size: 12.5px;
    font-weight: 650;
    letter-spacing: 0.02em;
  }
  .sources-head .count {
    font-size: 10.5px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    white-space: nowrap;
  }
  .src-close {
    display: none;
    margin-left: auto;
    width: 26px; height: 26px;
    border: 1px solid var(--line-2);
    border-radius: 8px;
    background: var(--panel-2);
    color: var(--ink-2);
    font-size: 15px;
    line-height: 1;
    place-items: center;
  }
  .sources-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 14px 16px 24px;
    display: grid;
    align-content: start;
    gap: 10px;
    scrollbar-width: thin;
    scrollbar-color: var(--line-2) transparent;
  }
  .sources-body::-webkit-scrollbar { width: 8px; }
  .sources-body::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 999px; }
  .sources-empty {
    font-size: 12.5px;
    line-height: 1.75;
    color: var(--faint);
    padding: 6px 2px;
  }
  .sources-empty b { color: var(--muted); font-weight: 600; }

  .src-card {
    padding: 12px 13px;
    border-radius: var(--radius-sm);
    background: var(--panel-2);
    border: 1px solid var(--line);
    animation: rise 0.26s cubic-bezier(0.22, 0.8, 0.3, 1) both;
  }
  .src-doc {
    display: flex; align-items: baseline; gap: 7px;
    font-size: 12.5px; font-weight: 600; color: var(--ink);
    word-break: break-all;
  }
  .src-doc svg { flex: 0 0 auto; color: var(--accent); position: relative; top: 1px; }
  .src-score {
    display: flex; align-items: center; gap: 8px;
    margin: 9px 0 8px;
  }
  .src-bar {
    flex: 1;
    height: 5px;
    border-radius: 999px;
    background: var(--line);
    overflow: hidden;
  }
  .src-bar i {
    display: block;
    height: 100%;
    border-radius: 999px;
    background: var(--score-hi);
    transition: width 0.5s cubic-bezier(0.22, 0.8, 0.3, 1);
  }
  .src-bar i.mid { background: var(--score-mid); }
  .src-bar i.lo { background: var(--score-lo); }
  .src-num {
    flex: 0 0 auto;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    min-width: 34px;
    text-align: right;
  }
  .src-snippet {
    font-size: 11.5px;
    line-height: 1.65;
    color: var(--muted);
    word-break: break-word;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ================= 动效 ================= */
  @keyframes rise {
    from { opacity: 0; transform: translateY(7px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes blink {

    40% { opacity: 1; transform: translateY(-2px); }

  @media (prefers-reduced-motion: reduce) {

  }

  /* ================= 响应式 ================= */
  @media (max-width: 1180px) {

    .app { grid-template-columns: minmax(0, 1fr); }

</style>

<script>
/* ============================================================
   FastAPI 文档智能问答 · 前端
   ------------------------------------------------------------
   界面形态：三栏「检索工作台」（导航 / 问答流 / 引用来源）
   运行形态：只调用同源后端代理 /api/chat，前端不持有任何令牌。
             后端不可用时明确报错，绝不返回模拟答案冒充真实回答。
   ============================================================ */
(function () {
  'use strict';

  // ---------- 示例问题 ----------
  var SIDEBAR_QUESTIONS = [
    '路径参数里的数值校验怎么做？',
    '如何启用 CORS 跨域？',
    'OAuth2 密码模式怎么实现？',
    '依赖注入是怎么工作的？'
  ];
  var HERO_CARDS = [
    { t: '参数校验', s: '用 Query / Path / Body 做类型与数值范围校验', q: '路径参数里的数值校验怎么做？' },
    { t: '跨域与中间件', s: 'CORS 中间件怎么配、为什么要配', q: '如何启用 CORS 跨域？' },
    { t: '安全认证', s: 'OAuth2 密码模式与 JWT 令牌的完整链路', q: 'OAuth2 密码模式怎么实现？' },
    { t: '文件与表单', s: 'UploadFile 接收上传、表单字段校验', q: '怎么处理文件上传？' }
  ];

  // ---------- 运行状态 ----------
  var mode = 'checking';     // checking | live | unavailable
  var keyReady = false;
  var busy = false;
  // 在途请求的中止器 + 请求序号：点「新对话」或发了新问题时，用它把上一条流作废
  // （否则旧回答会继续往已被清空的界面上写，还会误把输入框解锁）
  var activeCtrl = null;
  var reqSeq = 0;

  var stream = document.getElementById('stream');
  var streamInner = document.getElementById('streamInner');
  var hero = document.getElementById('hero');
  var inputEl = document.getElementById('input');
  var sendBtn = document.getElementById('sendBtn');
  var statusText = document.getElementById('statusText');
  var sourcesBody = document.getElementById('sourcesBody');
  var srcCount = document.getElementById('srcCount');
  var sourcesEl = document.getElementById('sources');

  // ---------- 小工具 ----------
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function isNearBottom() {
    return stream.scrollHeight - stream.scrollTop - stream.clientHeight < 90;
  }
  function scrollToBottom(smooth) {
    if (smooth) stream.scrollTo({ top: stream.scrollHeight, behavior: 'smooth' });
    else stream.scrollTop = stream.scrollHeight;
  }

  // ---------- Markdown 轻量渲染 ----------
  // 先整体转义，再注入受控的少量标签 —— 顺序不能反，否则就是 XSS 入口。
  function mdToHtml(src) {
    var blocks = [];
    var text = esc(src);

    // 独立代码块（含流式过程中尚未闭合的尾块）
    function stash(lang, code) {
      blocks.push('<pre class="code"><code>' + code.replace(/\n+$/, '') + '</code></pre>');
      return '\u0000B' + (blocks.length - 1) + '\u0000';
    }
    text = text.replace(/```[a-zA-Z0-9_+-]*\n([\s\S]*?)```/g, function (m, code) { return stash('', code); });
    text = text.replace(/```[a-zA-Z0-9_+-]*\n([\s\S]*)$/, function (m, code) { return stash('', code); });

    // 行内元素
    text = text.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    text = text.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');

    // 逐行处理标题 / 列表 / 段落
    var out = [];
    var list = null;
    function closeList() {
      if (list) { out.push('</' + list + '>'); list = null; }
    }
    var lines = text.split('\n');
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line) { closeList(); continue; }
      if (line.indexOf('\u0000B') === 0) { closeList(); out.push(line); continue; }

      var m = line.match(/^#{1,6}\s+(.*)$/);
      if (m) { closeList(); out.push('<h4>' + m[1] + '</h4>'); continue; }

      m = line.match(/^[-*+]\s+(.*)$/);
      if (m) {
        if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul'; }
        out.push('<li>' + m[1] + '</li>');
        continue;
      }
      m = line.match(/^\d+[.)]\s+(.*)$/);
      if (m) {
        if (list !== 'ol') { closeList(); out.push('<ol>'); list = 'ol'; }
        out.push('<li>' + m[1] + '</li>');
        continue;
      }
      closeList();
      out.push('<p>' + line + '</p>');
    }
    closeList();

    return out.join('').replace(/\u0000B(\d+)\u0000/g, function (m, idx) { return blocks[+idx]; });
  }

  // ---------- 界面状态 ----------
  function syncSendState() {
    // 服务端没配密钥时后端 reachable 但一问就是 500，所以「可用」必须同时满足
    // mode=live 且 keyReady —— 否则用户会白打一长串字、点发送才看到报错。
    var usable = (mode === 'live' && keyReady);
    inputEl.disabled = !usable || busy;
    sendBtn.disabled = !usable || busy || inputEl.value.trim().length === 0;
  }

  function setMode(next) {
    mode = next;
    document.body.dataset.mode = mode;

    if (mode === 'live' && keyReady) statusText.textContent = '知识库已连接';
    else if (mode === 'live') statusText.textContent = '服务端未配置密钥';
    else if (mode === 'checking') statusText.textContent = '连接中…';
    else statusText.textContent = '服务不可用';

    inputEl.placeholder = (mode === 'checking') ? '连接服务中…'
      : (mode === 'unavailable' ? '服务暂不可用'
      : (mode === 'live' && !keyReady) ? '服务端未配置密钥，暂不可提问'
      : '输入你的 FastAPI 问题…');
    syncSendState();
  }

  // ---------- 后端探测 ----------
  function probeHealth(timeoutMs) {
    return new Promise(function (resolve) {
      var ctrl = new AbortController();
      var timer = setTimeout(function () { ctrl.abort(); }, timeoutMs);
      fetch('/api/health', { cache: 'no-store', signal: ctrl.signal })
        .then(function (resp) {
          clearTimeout(timer);
          if (resp.status === 404 || resp.status === 405) { resolve('static'); return null; }
          if (!resp.ok) { resolve('down'); return null; }
          return resp.json().then(function (data) {
            if (!data || !data.ok) { resolve('down'); return; }
            keyReady = !!data.api_key_ready;
            resolve('ok');
          }).catch(function () { resolve('static'); });
        })
        .catch(function () { clearTimeout(timer); resolve('down'); });
    });
  }

  // 冷启动（Render 免费实例唤醒）期间持续重试，此窗口内禁止提问，
  // 避免用户拿到「假回答」却以为是真实结果。
  async function checkBackend() {
    var DEADLINE = 90000;
    var started = Date.now();
    setMode('checking');

    while (true) {
      var state = await probeHealth(8000);
      if (state === 'ok') { setMode('live'); return; }
      if (state === 'static') {
        setMode('unavailable');
        addNotice('没有检测到后端服务（/api/health 不存在）。本页需要配合 server.py 一起运行。', true);
        return;
      }
      if (Date.now() - started >= DEADLINE) {
        setMode('unavailable');
        addNotice('服务在 90 秒内仍未就绪。可能是后端冷启动失败或未部署，请稍后刷新重试。', true);
        return;
      }
      var waited = Math.round((Date.now() - started) / 1000);
      statusText.textContent = '唤醒服务中…' + waited + 's';
      await new Promise(function (r) { setTimeout(r, 3000); });
    }
  }

  // ---------- 提示 ----------
  function addNotice(text, isError) {
    var el = document.createElement('div');
    el.className = 'notice' + (isError ? ' err' : '');
    var icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    icon.setAttribute('viewBox', '0 0 24 24');
    icon.setAttribute('width', '15');
    icon.setAttribute('height', '15');
    icon.setAttribute('fill', 'none');
    icon.setAttribute('stroke', 'currentColor');
    icon.setAttribute('stroke-width', '2');
    icon.setAttribute('stroke-linecap', 'round');
    var c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', '12'); c.setAttribute('cy', '12'); c.setAttribute('r', '9');
    var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', 'M12 11v5M12 7.8h.01');
    icon.appendChild(c); icon.appendChild(p);

    var span = document.createElement('span');
    span.textContent = text;   // 文本节点插入，避免 XSS
    el.appendChild(icon);
    el.appendChild(span);
    streamInner.appendChild(el);
    scrollToBottom(false);
  }

  // ---------- 一轮问答 ----------
  function hideHero() {
    if (hero && hero.parentNode) hero.style.display = 'none';
  }
  function showHero() {
    if (hero) hero.style.display = '';
  }

  function appendTurn(question) {
    var turn = document.createElement('div');
    turn.className = 'turn';

    var q = document.createElement('div');
    q.className = 'q';
    var qText = document.createElement('div');
    qText.className = 'q-text';
    qText.textContent = question;   // 用户输入一律走文本节点
    // 检索式：只有服务端真的做了查询改写才会显示（事件到达前保持隐藏）
    var rewrite = document.createElement('div');
    rewrite.className = 'q-rewrite';
    rewrite.hidden = true;
    q.appendChild(qText);
    q.appendChild(rewrite);

    var a = document.createElement('div');
    a.className = 'a';
    var body = document.createElement('div');
    body.className = 'a-body';
    var meta = document.createElement('div');
    meta.className = 'a-meta';
    var content = document.createElement('div');
    content.className = 'a-content';
    body.appendChild(meta);
    body.appendChild(content);
    a.appendChild(body);

    turn.appendChild(q);
    turn.appendChild(a);
    streamInner.appendChild(turn);
    return { turn: turn, content: content, meta: meta, rewrite: rewrite };
  }

  function showTyping(content) {
    content.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  }

  function setSources(list) {
    sourcesBody.textContent = '';
    if (!list || !list.length) {
      srcCount.textContent = '0';
      var p = document.createElement('p');
      p.className = 'sources-empty';
      p.innerHTML = '本次回答没有命中知识库片段。<br>常见于<b>超出文档范围</b>的提问 —— 助手会据实说明，而不是编造答案。';
      sourcesBody.appendChild(p);
      return;
    }

    // 同一篇文档可能命中多段，按文档聚合，取最高分
    var byDoc = {};
    var order = [];
    list.forEach(function (s) {
      var name = s.document_name || '未命名文档';
      if (!byDoc[name]) { byDoc[name] = { name: name, score: 0, count: 0, snippet: '' }; order.push(name); }
      var item = byDoc[name];
      item.count += 1;
      var sc = typeof s.score === 'number' ? s.score : 0;
      if (sc >= item.score) { item.score = sc; item.snippet = s.content || item.snippet; }
      if (!item.snippet && s.content) item.snippet = s.content;
    });

    srcCount.textContent = order.length + ' 篇 / ' + list.length + ' 段';

    order.forEach(function (name) {
      var item = byDoc[name];
      var card = document.createElement('div');
      card.className = 'src-card';

      var doc = document.createElement('div');
      doc.className = 'src-doc';
      var ic = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      ic.setAttribute('viewBox', '0 0 24 24'); ic.setAttribute('width', '13'); ic.setAttribute('height', '13');
      ic.setAttribute('fill', 'none'); ic.setAttribute('stroke', 'currentColor');
      ic.setAttribute('stroke-width', '2'); ic.setAttribute('stroke-linecap', 'round');
      ic.setAttribute('stroke-linejoin', 'round');
      var pa = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      pa.setAttribute('d', 'M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z');
      ic.appendChild(pa);
      var pn = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      pn.setAttribute('d', 'M14 3v5h5');
      ic.appendChild(pn);
      var nameSpan = document.createElement('span');
      nameSpan.textContent = name;
      doc.appendChild(ic);
      doc.appendChild(nameSpan);

      var scoreRow = document.createElement('div');
      scoreRow.className = 'src-score';
      var bar = document.createElement('div');
      bar.className = 'src-bar';
      var fill = document.createElement('i');
      var pct = Math.max(0, Math.min(1, item.score)) * 100;
      fill.style.width = pct + '%';
      if (item.score < 0.75) fill.className = 'lo';
      else if (item.score < 0.9) fill.className = 'mid';
      bar.appendChild(fill);
      var num = document.createElement('div');
      num.className = 'src-num';
      num.textContent = pct.toFixed(0) + '%';
      scoreRow.appendChild(bar);
      scoreRow.appendChild(num);

      card.appendChild(doc);
      card.appendChild(scoreRow);

      if (item.snippet) {
        var snip = document.createElement('div');
        snip.className = 'src-snippet';
        snip.textContent = item.snippet;
        card.appendChild(snip);
      }

      sourcesBody.appendChild(card);
    });
  }

  // ---------- 发送与流式接收 ----------
  function send(text) {
    if (mode === 'checking') { addNotice('正在连接服务，请稍候…'); return; }
    if (mode === 'unavailable') { addNotice('服务暂不可用，请稍后刷新页面重试。', true); return; }
    if (busy) return;

    hideHero();
    var ref = appendTurn(text);
    setSources(null);
    scrollToBottom(false);
    streamReply(text, ref);
  }

  function streamReply(question, ref) {
    busy = true;
    syncSendState();
    showTyping(ref.content);
    // 流式期间把这段标成 aria-busy：回答是每个 delta 整段重刷的，不告诉读屏器
    // 「还没写完」，它会照着 aria-live 把半截答案反复念一遍
    ref.content.setAttribute('aria-busy', 'true');

    var answer = '';
    var gotDelta = false;
    var errored = false;
    var ctrl = new AbortController();
    var seq = ++reqSeq;      // 收尾时拿它对一次：序号变了说明这条流已被顶掉
    activeCtrl = ctrl;

    function paint() {
      if (!gotDelta) {
        ref.content.className = 'a-content streaming';
        gotDelta = true;
        var stick = isNearBottom();
        if (stick) scrollToBottom(false);
      }
      var stick2 = isNearBottom();
      ref.content.innerHTML = mdToHtml(answer);   // answer 已转义，安全
      if (stick2) scrollToBottom(false);
    }

    fetch('/api/chat', {
      method: 'POST',
      credentials: 'same-origin',
      signal: ctrl.signal,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: question })
    }).then(function (resp) {
      if (!resp.ok || !resp.body) {
        return resp.json().catch(function () { return {}; }).then(function (data) {
          throw new Error(data.error || ('HTTP ' + resp.status));
        });
      }

      var reader = resp.body.getReader();
      var decoder = new TextDecoder();
      var buffer = '';

      function step() {
        return reader.read().then(function (res) {
          if (res.done) return;
          buffer += decoder.decode(res.value, { stream: true });

          var blocks = buffer.split('\n\n');
          buffer = blocks.pop();

          blocks.forEach(function (block) {
            var ev = '';
            var dataLine = '';
            block.split('\n').forEach(function (line) {
              if (line.indexOf('event:') === 0) ev = line.slice(6).trim();
              else if (line.indexOf('data:') === 0) dataLine += line.slice(5).trim();
            });
            if (!ev) return;

            if (ev === 'delta') {
              var piece = '';
              try { piece = JSON.parse(dataLine).content || ''; } catch (e) { piece = ''; }
              if (piece) { answer += piece; paint(); }
            } else if (ev === 'refs') {
              try { setSources(JSON.parse(dataLine).sources || []); } catch (e) {}
            } else if (ev === 'query') {
              // 服务端最先推这条：kind 是改写结果，只有 rewritten 时才把检索式显示出来
              var info = {};
              try { info = JSON.parse(dataLine) || {}; } catch (e) { info = {}; }
              if (info.kind === 'rewritten' && info.query) {
                var tag = document.createElement('b');
                tag.textContent = '检索式';
                ref.rewrite.textContent = '';
                ref.rewrite.appendChild(tag);
                ref.rewrite.appendChild(document.createTextNode('：' + info.query));  // 文本节点，避免 XSS
                ref.rewrite.hidden = false;
                if (isNearBottom()) scrollToBottom(false);
              }
            } else if (ev === 'error') {
              var msg = '知识库暂时无法回答，请稍后再试。';
              try { msg = JSON.parse(dataLine).message || msg; } catch (e) {}
              ref.content.className = 'a-content';
              ref.content.textContent = msg;
              errored = true;
            }
            // meta / done：会话映射在服务端，前端无需处理
          });

          return step();
        });
      }
      return step();
    }).then(function () {
      ref.content.classList.remove('streaming');
      if (!answer && !errored) {
        var p = document.createElement('p');
        p.textContent = '没有收到回答内容，请重试一次。';
        ref.content.textContent = '';
        ref.content.appendChild(p);
      }
      // 出错时不挂「基于知识库」徽章：那句提示恰恰说明这次没有正确答案可依据
      if (!errored) {
        var badge = document.createElement('span');
        badge.className = 'pill';
        badge.textContent = '基于知识库';
        ref.meta.appendChild(badge);
      }
    }).catch(function (err) {
      if (err && err.name === 'AbortError') return;   // 用户点了「新对话」，这段已经作废
      ref.content.className = 'a-content';
      var p = document.createElement('p');
      p.textContent = (err && err.message) ? ('请求失败：' + err.message) : '网络异常，请稍后再试。';
      ref.content.textContent = '';
      ref.content.appendChild(p);
    }).then(function () {
      ref.content.removeAttribute('aria-busy');
      if (seq !== reqSeq) return;    // 这条流已被「新对话」或新提问顶掉，不许再动全局状态
      activeCtrl = null;
      busy = false;
      syncSendState();
    });
  }

  function resetConversation() {
    // 清空界面并请服务端遗忘当前会话映射，下一轮从首轮开始
    // 先掐断在途回答：服务端那边有「会话世代」兜底（旧结果不许写回），这里再把
    // 流停掉，界面才真的是「新对话」——否则旧回答还在后台往下流，输入框也不解锁
    if (activeCtrl) { activeCtrl.abort(); activeCtrl = null; }
    reqSeq += 1;
    busy = false;
    syncSendState();
    var children = Array.prototype.slice.call(streamInner.children);
    children.forEach(function (el) { if (el !== hero) el.remove(); });
    showHero();
    setSources(null);
    stream.scrollTop = 0;
    fetch('/api/chat/reset', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' }
    }).catch(function () { /* 后端不可用时界面已清空，无需提示 */ });
    inputEl.focus();
  }

  // ---------- 事件绑定 ----------
  function submit() {
    var text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    autoGrow();
    syncSendState();
    send(text);
  }

  function autoGrow() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 132) + 'px';
  }

  inputEl.addEventListener('input', function () { autoGrow(); syncSendState(); });
  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      submit();
    }
  });
  sendBtn.addEventListener('click', submit);
  document.getElementById('newChat').addEventListener('click', resetConversation);
  document.getElementById('newChatTop').addEventListener('click', resetConversation);   // 窄屏左栏隐藏后用它

  var srcToggle = document.getElementById('srcToggle');
  srcToggle.addEventListener('click', function () { sourcesEl.classList.add('open'); });
  document.getElementById('srcClose').addEventListener('click', function () { sourcesEl.classList.remove('open'); });

  // ---------- 渲染示例问题 ----------
  HERO_CARDS.forEach(function (c) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'card';
    var title = document.createElement('div');
    title.className = 'c-title';
    title.textContent = c.t;
    var sub = document.createElement('div');
    sub.className = 'c-sub';
    sub.textContent = c.s;
    btn.appendChild(title); btn.appendChild(sub);
    btn.addEventListener('click', function () { send(c.q); });
    document.getElementById('heroCards').appendChild(btn);
  });

  SIDEBAR_QUESTIONS.forEach(function (q) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'ex-item';
    b.textContent = q;
    b.addEventListener('click', function () { send(q); });
    document.getElementById('examples').appendChild(b);
  });

  // ---------- 启动 ----------
  setMode('checking');
  checkBackend();
})();
</script>
</body>
</html>
